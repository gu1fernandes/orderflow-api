openapi: 3.0.3
info:
  title: OrderFlow API
  version: 1.0.0
  description: API de pedidos com desconto por tipo de cliente.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Verificar disponibilidade da API
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: orderflow-api }
  /metrics:
    get:
      summary: Consultar metricas da aplicacao
      description: >
        Retorna o numero de pedidos criados com sucesso
        desde a inicializacao do processo. O contador
        fica em memoria e reinicia com a aplicacao.
      responses:
        '200':
          description: Metricas obtidas com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders_created_total
                properties:
                  orders_created_total:
                    type: integer
                    minimum: 0
                    example: 1
  /orders:
    post:
      summary: Criar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
            example:
              customer: Cliente Exemplo
              customerType: vip
              items:
                - product: Notebook
                  quantity: 2
                  unitPrice: 100
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Dados inválidos
  /orders/{id}:
    get:
      summary: Consultar pedido pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido não encontrado
components:
  schemas:
    OrderItem:
      type: object
      required: [product, quantity, unitPrice]
      properties:
        product: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
    CreateOrderInput:
      type: object
      additionalProperties: false
      required: [customer, customerType, items]
      properties:
        customer: { type: string, minLength: 1 }
        customerType:
          type: string
          enum: [regular, vip, employee]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    Order:
      allOf:
        - $ref: '#/components/schemas/CreateOrderInput'
        - type: object
          required: [id, subtotal, total, createdAt]
          properties:
            id: { type: string, format: uuid }
            subtotal: { type: number }
            total: { type: number }
            createdAt: { type: string, format: date-time }
